<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>GymSphere - All Members</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
  <div class="sidebar">
    <img src="logo.png" alt="GymSphere">
    <a href="index.html">🏠 Dashboard</a>
    <a href="register.html">📝 Add Member</a>
    <a href="members.html" class="active">👥 All Members</a>
    <a href="payments.html">💳 Payments</a>
  </div>
  <main>
    <h2>All Members</h2>
    <input id="search" placeholder="Search by name..." onkeyup="showMembers()">
    <table>
      <thead><tr><th>Name</th><th>Age</th><th>Phone</th><th>Plan</th><th>Expires</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
</div>
<script src="app.js"></script>
<script>
  function showMembers() {
    const text = document.getElementById("search").value.toLowerCase();
    let html = "";
    getMembers().forEach(function (m) {
      if (m.name.toLowerCase().indexOf(text) == -1) return;   // skip if not matching search
      const s = isActive(m) ? "Active" : "Expired";
      html += "<tr><td>" + m.name + "</td><td>" + m.age + "</td><td>" + m.phone + "</td><td>" + m.plan +
              "</td><td>" + expiryDate(m) + '</td><td class="' + s.toLowerCase() + '">' + s +
              '</td><td><button class="red" onclick="deleteMember(' + m.id + ')">Delete</button></td></tr>';
    });
    document.getElementById("rows").innerHTML = html || '<tr><td colspan="7">No members found</td></tr>';
  }

  function deleteMember(id) {
    if (!confirm("Delete this member?")) return;
    saveMembers(getMembers().filter(function (m) { return m.id != id; }));
    showMembers();
  }
  showMembers();
</script>
</body>
</html>
